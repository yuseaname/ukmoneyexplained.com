{{ if .Params.quick_answer }}
<aside class="ukm-card mb-8 border-l-4 border-l-ukm-crown" aria-labelledby="quick-answer-heading">
  <h2 id="quick-answer-heading" class="text-lg font-heading font-semibold text-ukm-ink mb-2">At a glance</h2>
  <ul class="space-y-1.5 text-ukm-slate">
    {{ range .Params.quick_answer }}
      <li class="flex gap-2">
        <span class="text-ukm-crown" aria-hidden="true">—</span>
        <span>{{ . }}</span>
      </li>
    {{ end }}
  </ul>
</aside>
{{ end }}
